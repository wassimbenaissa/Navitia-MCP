<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navitia MCP views</title>
<style>
  :root { --page: #F5F4F2; --card: #FFFFFF; --ink: #002830; --ink-2: #405E64; --border: #E1DDD8; color-scheme: light; }
  :root[data-theme="dark"] { --page: #06161A; --card: #0B1F24; --ink: #E8F1F2; --ink-2: #A7BEC2; --border: #24444B; color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: var(--page); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .bar strong { font-size: 14px; }
  label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
  select { font: inherit; }
  #stage { display: flex; justify-content: center; padding: 24px 16px 48px; }
  iframe { display: block; max-width: 100%; height: 200px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
</style>
</head>
<body>
<div class="bar">
  <strong>Navitia MCP views</strong>
  <label>Vue <select id="view"></select></label>
  <label>Scénario <select id="fixture"></select></label>
  <label>Thème
    <select id="theme"><option value="light">Clair</option><option value="dark">Sombre</option></select>
  </label>
  <label>Largeur
    <select id="width"><option value="720">720 px</option><option value="400">400 px</option></select>
  </label>
</div>
<div id="stage"></div>
<!-- preview-script -->
</body>
</html>
